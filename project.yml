name: Snap
options:
  bundleIdPrefix: com.snap
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.46.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Snap:
    type: application
    platform: macOS
    sources:
      - Snap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snap.app
        INFOPLIST_FILE: Snap/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Snap/Resources/Snap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Snap/Resources/Snap.entitlements
  SnapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SnapTests
    dependencies:
      - target: Snap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snap.tests
        GENERATE_INFOPLIST_FILE: YES
  SnapUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - SnapUITests
    dependencies:
      - target: Snap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snap.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Snap:
    build:
      targets:
        Snap: all
        SnapTests: [test]
        SnapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Snap
      targets:
        - name: SnapTests
        - name: SnapUITests
          parallelizable: false
